<!DOCTYPE html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora de sueldo por inflación INDEC | InflaSuel</title>
    <meta name="description" content="Calculá gratis cuánto debería aumentar tu sueldo según la inflación acumulada del IPC del INDEC. Elegí el período y obtené el porcentaje y el monto del aumento." />
    <link rel="canonical" href="https://inflasuel.vercel.app/" />
    <meta name="theme-color" content="#f7f6fb" />
    <script>
      // Aplicar el tema antes de pintar, para que no parpadee
      try {
        var tema = localStorage.getItem('tema')
        var oscuro = tema ? tema === 'oscuro' : matchMedia('(prefers-color-scheme: dark)').matches
        if (oscuro) document.documentElement.classList.add('dark')
        document.querySelector('meta[name="theme-color"]').content = oscuro ? '#121118' : '#f7f6fb'
      } catch (e) {}
    </script>

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="InflaSuel" />
